<style>
/* Layout: a contact-sheet index. Home lists three projects as large covers with their folder codes; each project opens as a masonry sheet with a frame-numbered lightbox. */
:root{
  --paper:#ededeb; --ink:#171717; --muted:#66655f; --rule:#cfcec9; --safelight:#b3261e; --scrim:rgba(14,14,13,.96);
  --display:'Avenir Next','Avenir','Figtree','Helvetica Neue',Arial,sans-serif;
  --body:'Avenir Next','Avenir','Figtree',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121211; --ink:#ebeae6; --muted:#9a9891; --rule:#2c2b28; --safelight:#ff5a4a; --scrim:rgba(6,6,6,.97); color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121211; --ink:#ebeae6; --muted:#9a9891; --rule:#2c2b28; --safelight:#ff5a4a; --scrim:rgba(6,6,6,.97); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--safelight);outline-offset:3px}
img{display:block;max-width:100%;height:auto}

.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 18px;border-bottom:1px solid var(--rule)}
.mark{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,28px);letter-spacing:-.01em;text-decoration:none}
.mark span{color:var(--safelight)}
.nav{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.nav a{text-decoration:none;color:var(--muted);padding-block:4px;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--safelight)}

/* home */
.lede{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;padding-block:clamp(28px,6vw,64px) clamp(20px,4vw,36px)}
.lede h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(38px,7vw,84px);line-height:1;letter-spacing:-.015em;text-wrap:balance}
.lede p{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;letter-spacing:.04em}
@media (max-width:560px){.lede{grid-template-columns:1fr}.lede p{text-align:left}}

.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px);padding-bottom:48px}
@media (max-width:820px){.projects{grid-template-columns:1fr}}
.proj{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.proj figure{margin:0;aspect-ratio:4/5;overflow:hidden;background:var(--rule);max-width:100%}
.proj img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease,filter .5s ease}
.proj:hover img{transform:scale(1.03)}
.proj .meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--rule);padding-top:10px}
.proj h2{margin:0;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:0}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}

/* project view */
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;padding-block:clamp(24px,5vw,52px) 20px}
.phead h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(32px,6vw,68px);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
.phead .code{text-align:right;line-height:1.8}
@media (max-width:560px){.phead{grid-template-columns:1fr}.phead .code{text-align:left}}
.sheet{columns:3 320px;column-gap:clamp(10px,1.6vw,18px);padding-bottom:40px}
.frame{break-inside:avoid;margin:0 0 clamp(10px,1.6vw,18px);cursor:zoom-in;position:relative;background:var(--rule)}
.frame button{all:unset;display:block;width:100%;cursor:zoom-in}
.frame button:focus-visible{outline:2px solid var(--safelight);outline-offset:2px}
.frame .no{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:#fff;mix-blend-mode:difference;opacity:0;transition:opacity .2s}
.frame:hover .no,.frame button:focus-visible + .no{opacity:1}
.pager{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--rule);padding-block:18px 40px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pager a{text-decoration:none;color:var(--muted)}
.pager a:hover{color:var(--ink)}

footer{border-top:1px solid var(--rule);padding-block:18px 28px;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;letter-spacing:.04em}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#d9d8d3}
.lb-stage{display:flex;align-items:center;justify-content:center;min-height:0;padding-block:10px}
.lb-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.lb button{font:inherit;color:#ececea;background:none;border:1px solid #4a4945;padding:7px 12px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.lb button:hover{border-color:#ff5a4a;color:#fff}
.lb .ctrls{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Per-project identities. Each is a deliberate single look, so it overrides both themes. ===== */
.ptitle{display:block}

/* THE CITY of ANGLEs: night stage. Black room, amber spotlight, heavy Avenir. */
:root[data-p="tcoa"]{--paper:#0b0b0d;--ink:#f2efe8;--muted:#8f8b82;--rule:#26252a;--safelight:#ffb23e;--scrim:rgba(4,4,5,.97);color-scheme:dark}
:root[data-p="tcoa"] body{background:radial-gradient(ellipse 80% 40% at 50% -8%,rgba(255,178,62,.16),transparent 70%),var(--paper)}
:root[data-p="tcoa"] .phead h1{font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(34px,7vw,88px)}
:root[data-p="tcoa"] .phead h1 em{font-style:normal;font-weight:400;text-transform:none;color:var(--safelight)}
:root[data-p="tcoa"] .frame{background:#18171b}
:root[data-p="tcoa"] .frame img{transition:filter .3s}
:root[data-p="tcoa"] .sheet:hover .frame img{filter:brightness(.55)}
:root[data-p="tcoa"] .sheet .frame:hover img{filter:none}

/* +DIRTY | BLACK | BLOOD+: street zine. Stark white, black ink, poster type, blood-red rule. */
:root[data-p="dbb"]{--paper:#ffffff;--ink:#0a0a0a;--muted:#555;--rule:#0a0a0a;--safelight:#c1121f;--scrim:rgba(0,0,0,.97);color-scheme:light;--mono:'Space Mono',ui-monospace,Menlo,monospace}
:root[data-p="dbb"] .mast{border-bottom:4px solid var(--ink)}
:root[data-p="dbb"] .phead{border-bottom:4px solid var(--safelight);margin-bottom:12px}
:root[data-p="dbb"] .phead h1{font-family:'Anton','Impact','Haettenschweiler',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,10vw,132px);line-height:.9;letter-spacing:0}
:root[data-p="dbb"] .phead h1 b{color:var(--safelight);font-weight:400}
:root[data-p="dbb"] .sheet{column-gap:6px}
:root[data-p="dbb"] .frame{margin-bottom:6px;background:#000}
:root[data-p="dbb"] .frame img{filter:grayscale(1) contrast(1.05)}
:root[data-p="dbb"] .frame .no{opacity:1;background:var(--ink);color:#fff;mix-blend-mode:normal;left:0;bottom:0;padding:2px 6px}
:root[data-p="dbb"] footer{border-top:4px solid var(--ink)}

/* >Picture Postcards | LA<: sun-faded postcard rack. Warm sand, script and block lettering, prints laid out by hand. */
:root[data-p="ppla"]{--paper:#efe3cf;--ink:#22303f;--muted:#6c6352;--rule:#d6c6aa;--safelight:#e2572b;--scrim:rgba(24,30,38,.95);color-scheme:light}
:root[data-p="ppla"] body{background:linear-gradient(180deg,#9fc6dd 0,#e7c8a0 220px,var(--paper) 520px)}
:root[data-p="ppla"] .mast{border-bottom-color:rgba(34,48,63,.25)}
:root[data-p="ppla"] .phead h1{display:flex;flex-direction:column;line-height:.9}
:root[data-p="ppla"] .phead h1 .s{font-family:'Homemade Apple','Bradley Hand','Segoe Script',cursive;font-weight:400;font-size:clamp(40px,7vw,84px);color:var(--safelight);letter-spacing:0;transform:rotate(-3deg);transform-origin:left;margin-bottom:-.1em}
:root[data-p="ppla"] .phead h1 .b{font-family:'Bebas Neue','Oswald',Impact,sans-serif;font-weight:400;font-size:clamp(84px,18vw,220px);letter-spacing:.02em;color:var(--ink);text-shadow:4px 4px 0 #f3b34c}
:root[data-p="ppla"] .phead .code{border:2px dashed var(--ink);padding:10px 14px;transform:rotate(2deg);background:#f7efe1}
:root[data-p="ppla"] .sheet{columns:4 220px;column-gap:26px;padding-top:12px}
:root[data-p="ppla"] .frame{background:transparent;margin-bottom:30px;box-shadow:0 10px 18px rgba(60,40,10,.22),0 2px 3px rgba(60,40,10,.2);transition:transform .25s}
:root[data-p="ppla"] .frame:nth-child(4n+1){transform:rotate(-1.6deg)}

:root[data-p="ppla"] .frame:nth-child(4n+3){transform:rotate(-.6deg)}
:root[data-p="ppla"] .frame:nth-child(4n){transform:rotate(1.8deg)}
:root[data-p="ppla"] .frame:hover{transform:rotate(0) translateY(-4px) scale(1.02)}
:root[data-p="ppla"] .frame .no{display:none}
:root[data-p="ppla"] .pager{border-top-color:rgba(34,48,63,.25)}

function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280};}
function postmark(n){
  const r=rnd(n*7+3), [y,m,d]=(PD[n]||'2021-01-01').split('-'), t=TOWNS[Math.floor(r()*TOWNS.length)], ink=INKS[Math.floor(r()*INKS.length)];
  const w0=r(), rot=Math.round(-28+r()*56), op=(0.5+r()*0.25).toFixed(2);
  const corner=Math.floor(r()*4), top=corner<2?(-6+r()*18):(55+r()*30), left=corner%2?(42+r()*30):(-8+r()*16);
  const waves=r()>.35, id='pm'+n, w=waves?Math.round(62+w0*14):Math.round(34+w0*12);
  const wave=k=>{let p='M118 '+(34+k*13);for(let x=118;x<=230;x+=14)p+=' q7 -6 14 0';return `<path d="${p}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;};
  const svg=`<svg viewBox="0 0 ${waves?236:124} 124" aria-hidden="true"><g fill="currentColor" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500">
    <circle cx="62" cy="62" r="56" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="62" cy="62" r="38" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <defs><path id="${id}a" d="M18 62 A44 44 0 0 1 106 62"/><path id="${id}b" d="M14 62 A48 48 0 0 0 110 62"/></defs>
    <text font-size="11.5" letter-spacing="1.5"><textPath href="#${id}a" startOffset="50%" text-anchor="middle">${t[0]}</textPath></text>
    <text font-size="10.5" letter-spacing="2"><textPath href="#${id}b" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">${t[1]}</textPath></text>
    <text x="62" y="58" font-size="15" text-anchor="middle" letter-spacing="1">${MON[+m-1]} ${+d}</text>
    <text x="62" y="76" font-size="14" text-anchor="middle" letter-spacing="2">${y}</text></g>
    ${waves?[0,1,2,3,4].map(wave).join(''):''}</svg>`;
  return `<span class="pm" style="width:${w}%;top:${top.toFixed(0)}%;left:${left.toFixed(0)}%;transform:rotate(${rot}deg);opacity:${op};color:${ink}">${svg}</span>`;
}
const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');

function home(){
  view.innerHTML=`<section class="lede"><h1>Photography projects</h1><p>${P.length} projects · ${P.reduce((a,p)=>a+M[p.id].length,0)} frames</p></section>
  <section class="projects">${P.map(p=>{const c=M[p.id][p.cover];return `<a class="proj" href="#${p.id}">
    <figure><img src="${c.src}" width="${c.w}" height="${c.h}" alt="Cover photo for ${esc(p.title)}" loading="eager"></figure>
    <div class="meta"><h2>${esc(p.title)}</h2><span class="code">${p.code}</span></div></a>`}).join('')}</section>`;
}
function project(p){
  const list=M[p.id], i=P.indexOf(p), nxt=P[(i+1)%P.length], prv=P[(i+P.length-1)%P.length];
  const head = p.id==='ppla'
    ? `<section class="splash"><img src="img/ppla-splash.jpg" width="2400" height="1800" alt="A lone palm tree above green hills with the downtown Los Angeles skyline behind it" loading="eager"><div class="splash-in"><h1 aria-label="${esc(p.title)}">${p.h}</h1></div><p class="wish">…Wish you were here!</p><button type="button" class="go" id="go">Browse the postcards ↓</button></section>`
    : `<section class="phead"><h1 aria-label="${esc(p.title)}">${p.h}</h1><div class="code">${p.code}<br>${list.length} frames<br>${esc(p.note)}</div></section>`;
  view.innerHTML=`${head}
  <section class="sheet">${list.map((f,n)=>`<figure class="frame"><button type="button" data-n="${n}" aria-label="Open frame ${n+1} of ${list.length}"><img src="${f.src}" width="${f.w}" height="${f.h}" alt="${esc(p.title)}, frame ${n+1}${f.cap?', '+esc(f.cap):''}" loading="${n<6?'eager':'lazy'}"></button>${p.id==='ppla'?postmark(n):''}<span class="no">FR ${pad(n+1)}</span></figure>`).join('')}</section>
  ${P.length>1?`<nav class="pager" aria-label="More projects"><a href="#${prv.id}">← ${esc(prv.title)}</a><a href="#${nxt.id}">${esc(nxt.title)} →</a></nav>`:''}`;
  view.querySelectorAll('.frame button').forEach(b=>b.addEventListener('click',()=>openLB(p,+b.dataset.n)));
  const go=document.getElementById('go'); if(go) go.onclick=()=>view.querySelector('.sheet').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function route(){
  const p=P[0]; document.documentElement.dataset.p=p.id; project(p); closeLB();
}

/* lightbox */
const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img');
let cur=null, idx=0, lastFocus=null;
function show(){const f=M[cur.id][idx];lbImg.src=f.src;lbImg.alt=`${cur.title}, frame ${idx+1}`;
  document.getElementById('lb-title').textContent=`${cur.code} · ${cur.title}`;
  document.getElementById('lb-cap').textContent=f.cap||'';
  document.getElementById('lb-count').textContent=`FR ${pad(idx+1)}/${pad(M[cur.id].length)}`;
  const nx=M[cur.id][(idx+1)%M[cur.id].length]; new Image().src=nx.src;}
function openLB(p,n){cur=p;idx=n;lastFocus=document.activeElement;lb.hidden=false;document.body.style.overflow='hidden';show();document.getElementById('lb-close').focus();}
function closeLB(){if(lb.hidden)return;lb.hidden=true;document.body.style.overflow='';lastFocus&&lastFocus.focus&&lastFocus.focus();}
function step(d){const L=M[cur.id].length;idx=(idx+d+L)%L;show();}
document.getElementById('lb-close').onclick=closeLB;
document.getElementById('lb-prev').onclick=()=>step(-1);
document.getElementById('lb-next').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('lb-stage'))closeLB();});
document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
let tx=null;lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)step(dx<0?1:-1);tx=null});

route();
</script>
</body>
</html>
